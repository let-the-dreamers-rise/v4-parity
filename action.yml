name: v4-parity
description: Check that your Uniswap v4 quoter matches the real PoolManager, using vectors generated by executing v4-core.
branding: { icon: check-circle, color: purple }
inputs:
  command:
    description: >
      Command that runs your adapter. It is called as `<command> <vectors.json> <results.jsonl>`
      (also exported as V4P_VECTORS and V4P_RESULTS) and must write one JSON line per vector.
      See kit/README.md for the format and kit/adapters/ for examples.
    required: true
  vectors:
    description: "Which vector set: `swaps` (protocol fees on, 3,000 swaps), `swaps-nopf` (protocol fees off), or a path to your own file."
    default: swaps
  baseline:
    description: Optional JSON file of vector ids you already know fail (created with --write-baseline). Only new failures fail the job.
    default: ""
  allow-unsupported:
    description: Treat vectors your adapter reports as `unsupported` as acceptable (e.g. hook overrides you don't route).
    default: "true"
  working-directory:
    description: Directory to run the command in.
    default: "."
outputs:
  report:
    description: Path to the JSON report.
    value: ${{ steps.check.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        V4P_DIR: ${{ github.action_path }}
        V4P_SET: ${{ inputs.vectors }}
        V4P_CMD: ${{ inputs.command }}
        V4P_BASELINE: ${{ inputs.baseline }}
        V4P_ALLOW: ${{ inputs.allow-unsupported }}
      run: |
        case "$V4P_SET" in
          swaps) vec="$V4P_DIR/vectors/swaps.json" ;;
          swaps-nopf) vec="$V4P_DIR/vectors-nopf/swaps.json" ;;
          *) vec="$V4P_SET" ;;
        esac
        report="$RUNNER_TEMP/v4-parity-report.json"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        args=(--vectors "$vec" --run "$V4P_CMD" --summary "$GITHUB_STEP_SUMMARY" --report "$report")
        [ -n "$V4P_BASELINE" ] && args+=(--baseline "$V4P_BASELINE")
        [ "$V4P_ALLOW" = "true" ] && args+=(--allow-unsupported)
        node "$V4P_DIR/kit/check.mjs" "${args[@]}"
