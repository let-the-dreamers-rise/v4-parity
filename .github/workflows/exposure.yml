name: exposure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/exposure.mjs, .github/workflows/exposure.yml]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, base, arbitrum, optimism, polygon, bnb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/exposure.mjs ${{ matrix.chain }}
      - if: always()
        run: cat exposure/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; cat exposure/*.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exposure-${{ matrix.chain }}
          path: exposure/
