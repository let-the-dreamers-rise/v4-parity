[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["v4-core-test/=lib/v4-core/test/", "forge-std/=lib/v4-core/lib/forge-std/src/", "v4-core/=lib/v4-core/src/", "solmate/=lib/v4-core/lib/solmate/", "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/"]
